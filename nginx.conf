# ---------------------------------------------------------------------------
# Conditional access logging.
#
# One always-on kiosk polls /alerts.json every 5s and /announce.json,
# /profiles.json, /source.json every 15s — ~28 access-log lines/minute per
# device. With Docker's unbounded json-file driver that grew the container log
# to ~674 MB in 14 days. We drop ONLY the successful GET polls of those exact
# paths; everything else still lands in the log.
#
# $uri is the normalized request path with the query string already stripped,
# so `/alerts.json?ts=1753600000` matches the exact key below — a query string
# cannot defeat this, and `/alerts.jsonx` or `/foo/alerts.json` do not match.
map $uri $clock_poll_path {
  default         0;
  /alerts.json    1;
  /announce.json  1;
  /profiles.json  1;
  /source.json    1;
}

# 2xx only. 401/404/429/5xx — and the synthetic 000 — fall through to 0 and
# are therefore always logged.
map $status $clock_status_2xx {
  default          0;
  ~^2[0-9][0-9]$   1;
}

# Log unless this is (hot path) AND (2xx) AND (GET). PUT/DELETE/HEAD, auth
# failures, unusual requests and every other route keep logging. Deliberately
# NOT a blanket `access_log off`.
map $clock_poll_path$clock_status_2xx$request_method $clock_log {
  default   1;
  "11GET"   0;
}

server {
  listen       80;
  server_name  _;
  root   /usr/share/nginx/html;
  index  index.html;

  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Overrides the unconditional http-level access_log from the stock
  # nginx.conf. `main` is defined there; both files are the container's
  # stdout/stderr symlinks, so `docker logs` still shows everything kept.
  access_log /var/log/nginx/access.log main if=$clock_log;
  # Warnings and above. Drops routine notice/info chatter, keeps real errors.
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml application/json;

  # Service worker must always revalidate so app-shell updates ship.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  # Admin page — basic-auth (see /etc/nginx/admin_auth.conf, written at startup).
  location = /admin.html {
    include /etc/nginx/admin_auth.conf;
    add_header Cache-Control "no-cache";
  }
  # JS/CSS have no content hash (no build step) — revalidate each load so code
  # updates ship. The service worker still caches them for offline use.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "no-cache";
  }
  # Ensure the manifest is served with the correct MIME type.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # Server-provided location config — admin can edit live, so never cache it.
  location = /config.json {
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  # Server-pushed weather (written by the fetcher) — always fresh, may 404 until
  # the first successful fetch (client falls back to direct / cache).
  location = /weather.json {
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  # Server-pushed announcements — served from the writable /data dir and accepted
  # via WebDAV PUT from the admin page. Polled by every device, must be fresh.
  location = /announce.json {
    root /data;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    dav_methods PUT;
    create_full_put_path off;
    client_body_temp_path /data/tmp;
    client_max_body_size 64k;
    # GET (device polling) stays open; writing (PUT) requires admin auth.
    limit_except GET { include /etc/nginx/admin_auth.conf; }
  }
  # Admin-managed custom room profiles — served from the writable /data dir,
  # written via WebDAV PUT from the admin page. Polled by every device.
  location = /profiles.json {
    root /data;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    dav_methods PUT;
    create_full_put_path off;
    client_body_temp_path /data/tmp;
    client_max_body_size 64k;
    # GET (device polling) stays open; writing (PUT) requires admin auth.
    limit_except GET { include /etc/nginx/admin_auth.conf; }
  }
  # Admin-managed time/weather Source authority. Written via WebDAV PUT from the
  # admin page (auth-gated); polled by every device, must be fresh.
  location = /source.json {
    root /data;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    dav_methods PUT;
    create_full_put_path off;
    client_body_temp_path /data/tmp;
    client_max_body_size 64k;
    # GET (device polling) stays open; writing (PUT) requires admin auth.
    limit_except GET { include /etc/nginx/admin_auth.conf; }
  }
  # Admin-managed per-profile HA dashboards. Written via WebDAV PUT from the
  # admin page (auth-gated); polled by every device. Holds no secrets.
  location = /dashboards.json {
    root /data;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    dav_methods PUT;
    create_full_put_path off;
    client_body_temp_path /data/tmp;
    client_max_body_size 256k;
    # GET (device polling) stays open; writing (PUT) requires admin auth.
    limit_except GET { include /etc/nginx/admin_auth.conf; }
  }
  # Critical alerts — served by the alert sidecar (not a static file). Devices
  # poll this; it is open GET and must always be fresh. Proxied via a variable +
  # resolver so nginx starts even if the sidecar is briefly down.
  location = /alerts.json {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $alert_up "alert-sidecar:8090";
    proxy_pass http://$alert_up/alerts.json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  # Current presence state (room -> {present, ts}); served by the sidecar, open GET.
  location = /presence.json {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $alert_up "alert-sidecar:8090";
    proxy_pass http://$alert_up/presence.json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  # Snapshot upload — larger body than alerts; own exact-match location so the
  # general /api/ keeps its tight 16k cap. Bearer auth enforced by the sidecar.
  location = /api/snapshot {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $alert_up "alert-sidecar:8090";
    client_max_body_size 2m;
    proxy_pass http://$alert_up$request_uri;
  }
  # Snapshot-upload token for the kiosk (low-privilege, upload-only). Never cache.
  location = /snapshot.json {
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  # Write API for Home Assistant. Bearer auth is enforced by the sidecar itself
  # (not nginx). Forwards the Authorization header through.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $alert_up "alert-sidecar:8090";
    client_max_body_size 16k;
    proxy_pass http://$alert_up$request_uri;
  }
  # Admin "clear alert" — basic-auth gated. nginx injects the bearer token from
  # env (written to alert_clear.conf at startup) so the admin page never sees it.
  location = /admin/alert-clear {
    include /etc/nginx/admin_auth.conf;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $alert_up "alert-sidecar:8090";
    include /etc/nginx/alert_clear.conf;
  }
  # Uploaded announcement media (images / GIFs). Open GET for devices; PUT and
  # DELETE require admin basic-auth. Files live in the writable /data/uploads dir.
  location /uploads/ {
    root /data;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    dav_methods PUT DELETE;
    create_full_put_path on;
    client_body_temp_path /data/tmp;
    client_max_body_size 8m;
    limit_except GET { include /etc/nginx/admin_auth.conf; }
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
