services:
  clock:
    build: .
    image: clock-pwa
    container_name: clock-pwa
    ports:
      - "8080:80"     # open http://localhost:8080
    environment:
      # Server location for all devices (Settings -> Location -> Server).
      # Written into config.json at container start. Edit + `docker compose up -d`.
      CLOCK_LAT: "39.7684"
      CLOCK_LON: "-86.1581"
      CLOCK_CITY: "Indianapolis"
      # Admin page (/admin.html) + announcement PUT basic-auth. Change the password!
      # Set ADMIN_AUTH=off to disable auth entirely.
      ADMIN_USER: "admin"
      ADMIN_PASS: "change-me"
      # Bearer token Home Assistant sends to push critical alerts. Used here only
      # so the admin "Active Alerts" Clear button can proxy to the sidecar with the
      # token injected. Must match the alert-sidecar service's value below.
      ALERT_API_TOKEN: "${ALERT_API_TOKEN:-}"
      # Low-privilege snapshot-upload token. Published to the kiosk via snapshot.json;
      # the kiosk uses it to POST one JPEG per arrival. Separate from ALERT_API_TOKEN
      # and the admin password. Unset = snapshots disabled.
      SNAPSHOT_TOKEN: "${SNAPSHOT_TOKEN:-}"
    # Announcements are sent from the admin page (http://<host>:8080/admin.html)
    # or the helper (docker exec clock-pwa /usr/local/bin/announce.sh "msg"); they
    # write /data/announce.json.
    #
    # /data holds ALL admin state (announce.json, profiles.json, source.json,
    # dashboards.json, uploads/). It used to live in the container's writable
    # layer, so `docker compose up -d --build` silently discarded it. The named
    # volume below makes it survive recreation — see the README migration note
    # before adding this to an existing deployment.
    volumes:
      - clockdata:/data
      # Alternative to the env vars above: mount + live-edit config.json instead.
      # - ./config.json:/usr/share/nginx/html/config.json
    restart: unless-stopped
    # Bounded logs. json-file with no limits let one always-on kiosk grow this
    # container's log to 674 MB in 14 days. 10m x 3 caps it at ~30 MiB and
    # rotates/deletes old segments automatically.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alert-sidecar:
    build: ./alert-sidecar
    image: clock-alert-sidecar
    container_name: clock-alert-sidecar
    environment:
      # Shared secret HA sends as `Authorization: Bearer <token>`. REQUIRED to
      # enable the API — unset/blank means the sidecar rejects all writes (503).
      ALERT_API_TOKEN: "${ALERT_API_TOKEN:-}"
      ALERTS_FILE: "/data/alerts.json"
      SNAPSHOT_TOKEN: "${SNAPSHOT_TOKEN:-}"
      SNAPSHOTS_DIR: "/data/snapshots"
      # Home Assistant webhook the sidecar relays presence to (server-side, no CORS).
      # Unset = presence relay is a no-op. e.g. https://ha.local:8123/api/webhook/<id>
      HA_WEBHOOK_URL: "${HA_WEBHOOK_URL:-}"
    volumes:
      - alertdata:/data
      - snapshots:/data/snapshots
    restart: unless-stopped
    # Bounded logs — same cap as the clock service (~30 MiB max).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  alertdata:
  # Admin state for the clock container: announce.json, profiles.json,
  # source.json, dashboards.json, uploads/. Must outlive the container.
  clockdata:
  # Arrival snapshots. Defaults to a plain local Docker volume so the stack comes
  # up with ZERO config (snapshots are opt-in and off by default anyway).
  #
  # To store snapshots on a NAS instead, point this volume at your export — either
  # edit it here, or (cleaner) drop a docker-compose.override.yml next to this file:
  #
  #   volumes:
  #     snapshots:
  #       driver: local
  #       driver_opts:
  #         type: nfs
  #         o: "addr=192.168.x.y,nfsvers=4,rw,soft"     # your TrueNAS IP
  #         device: ":/mnt/<pool>/<dataset>/clock-snapshots"
  #
  # SMB/CIFS or a host bind-mount also work — see the README.
  snapshots:
